<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 青鹭收银</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}?v=20260806" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="bi bi-tiles"></i>
                <h3>青鹭雀庄</h3>
                <small>收银系统 v2.0</small>
            </div>
            <div class="login-form">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="loginUsername" placeholder="输入用户名" autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="loginPassword" placeholder="输入密码">
                    </div>
                </div>
                <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
                <button class="btn btn-primary w-100 btn-lg" onclick="doLogin()">
                    <i class="bi bi-box-arrow-in-right"></i> 登录
                </button>
            </div>
        </div>
    </div>
    <script>
    document.getElementById('loginPassword').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') doLogin();
    });
    async function doLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!username || !password) return;
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (res.ok) {
                const role = data.user && data.user.role;
                if (role === 'admin') window.location.href = '/operations';
                else if (role === 'staff') window.location.href = '/staff_tasks';
                else window.location.href = '/';
            } else {
                const el = document.getElementById('loginError');
                el.textContent = data.error || '登录失败';
                el.classList.remove('d-none');
            }
        } catch (e) {
            alert('网络错误');
        }
    }
    </script>
</body>
</html>
